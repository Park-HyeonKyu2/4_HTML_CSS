<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>텍스트</title>
</head>

<body>
    <!-- 
        블록 태그 : 한 줄 전체를 차지하며 줄바꿈이 자동으로 발생함
        인라인 태그 : 내용만큼만 공간을 차지하며 줄바꿈이 발생하지 않음

        코드 자동 정렬
        윈도우 : shift + alt + f
        맥 : shift + option + f
    -->
    <!-- 제목태그 -->
    <!-- 헤딩태그는 6단계로 나누어져 있고 제목을 작성할 때 사용한다. -->
    <!-- 헤딩태그는 한 줄 전체를 차지하므로 블록 태그이다. -->
    <h1>안녕하세요. Heading</h1> 여기에 문자를 입력하면 아래로 내려감
    <h2>안녕하세요. heading</h2>
    <h3>안녕하세요. heading</h3>
    <h4>안녕하세요. heading</h4>
    <h5>안녕하세요. heading</h5>
    <h6>안녕하세요. heading</h6>

    <!-- 일반 문자는 인라인 취급이기 때문에 줄 바꿈이 일어나지 않는다. -->
    일반 텍스트
    일반 텍스트
    <!-- 엔터 혹은 글자를 멀리 밀더라도 한 칸만 띄어진다. -->
    일반 텍스트
    <!-- &nbsp; : 한칸 띄어준다. -->
    일반&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;텍스트
    <!-- <br>은 개행을 수행한다. -->
    일반 텍스트<br> 일반 텍스트
    <hr>

    <!-- 문단 태그 -->
    <!-- 옆에 아무리 글자를 쓰더라도 줄이 내려가는 블록 태그이다. -->
    <p>문단을 만드는 태그</p> 일반 텍스트

    <!-- 서식 태그 -->
     <!-- <b>와 <strong>태그는 글자를 굵게 만들어준다.
        <strong>는 음성으로 읽을 때 더 강조해서 읽는다.
        -->
    <p><b>굵게</b> 표현하기</p>
    <p><strong>굵게</strong> 표현하기</p>
    <p><i>이탤릭체</i> 표현하기</p>
    <p><em>이탤릭체</em> 표현하기</p>
    <p><ins>밑줄</ins> 표현하기</p>
    <p><del>삭제</del> 표현하기</p>
    <!-- <sup>는 제곱  -->
    <p>x<sup>2</sup> + y<sup>3</sup> = z</p>
    <!-- <sub>는 작은 첨자 -->
    <p>H<sub>2</sub>O</p>

</body>

</html>
