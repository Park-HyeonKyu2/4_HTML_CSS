<!DOCTYPE html>
<!-- html 버전5 표준을 표시한다. -->
<html lang="ko">
<!-- 소리로 듣을 언어 -->
<head>
    <meta charset="UTF-8">
    <!-- 눈에 보이는 글자 인코딩 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 모바일 환경에 잘 보이도록 반응형으로 설정 -->
    <title>HTML</title>
    <!-- 제목표시줄에 들어간다. -->
</head>
<!-- <head>에는 문서의 정보가 들어간다. -->
<body>
    <!-- 
        HTML 주석문
        작성일: 2026-06-10
        작성자: 김사과
    -->
    HTML이란?!!
</body>
<!-- <body>에는 실제 화면에 보일 정보가 들어간다. -->
</html>
